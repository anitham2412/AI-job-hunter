//spring.application.name=backend

# App name
spring.application.name=ai-job-hunter

# Server port
server.port=8080

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/aijobhunter
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Logging
logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG

# RapidAPI Key for JSearch
rapidapi.key=5d62914cdcmsh45172a3d8afe626p18c323jsnea0dc8d70cd8
rapidapi.host=jsearch.p.rapidapi.com
rapidapi.base-url=https://jsearch.p.rapidapi.com

spring.webflux.netty.ssl.use-insecure-trust-manager=false



# Groq AI
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=meta-llama/llama-4-scout-17b-16e-instruct

#  Scheduler
spring.task.scheduling.pool.size=5
